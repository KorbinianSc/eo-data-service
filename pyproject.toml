[project]
name = "eo-data-service"
version = "0.1.0"
description = "Cloud-native Earth Observation data service"
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "dask",
    "fastapi",
    "pydantic",
    "python-dotenv",
    "rasterio",
    "rioxarray",
    "pystac[validation]",
    "uvicorn[standard]",
    "xarray",
    "zarr",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]